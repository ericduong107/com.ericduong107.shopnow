name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Chỉ định thư mục làm việc mặc định cho tất cả các bước
defaults:
  run:
    working-directory: shop_now

jobs:
  # ---------- CI: phân tích + test ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
 
  # ---------- CD: deploy Web lên Firebase Hosting ----------
  deploy-web:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - run: flutter pub get
      - run: flutter build web --release
 
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: shop_now
 
  # ---------- CD: build APK và đưa lên Firebase App Distribution ----------
  distribute-android:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
 
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - run: flutter pub get
      - run: flutter build apk --release
 
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: shop_now/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}